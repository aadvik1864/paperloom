services:
  - type: web
    name: paperloom-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    repo: https://github.com/aadvik1864/paperloom
    branch: main
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: RATELIMIT_STORAGE_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PROXY_HOPS
        value: "1"
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
